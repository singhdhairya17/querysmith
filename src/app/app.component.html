<div class="app">
  <header class="topbar">
    <div class="topbar__brand">
      <svg class="topbar__logo" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="5">
          <path d="M50 10 84.64 30v40L50 90 15.36 70V30z" />
          <path d="M50 10 84.64 70H15.36z" />
        </g>
        <g fill="currentColor">
          <circle cx="50" cy="10" r="8" />
          <circle cx="84.64" cy="30" r="8" />
          <circle cx="84.64" cy="70" r="8" />
          <circle cx="50" cy="90" r="8" />
          <circle cx="15.36" cy="70" r="8" />
          <circle cx="15.36" cy="30" r="8" />
        </g>
      </svg>
      <span class="topbar__name">querysmith</span>
      <span class="topbar__divider" aria-hidden="true"></span>
      <span class="topbar__tagline">GraphQL query builder</span>
    </div>
    <nav class="topbar__links">
      <a class="topbar__github" href="https://github.com/singhdhairya17/querysmith" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main class="app__main">
    <app-graphql-query-builder
      [graphqlEndpointUrl]="demoEndpoint"
      (submitted)="onSubmit($event)">
    </app-graphql-query-builder>
  </main>

  <section *ngIf="lastSubmitted" class="payload">
    <div class="payload__bar">
      <h2>Submitted payload</h2>
      <button type="button" (click)="lastSubmitted = null">Close</button>
    </div>
    <pre>{{ lastSubmitted | json }}</pre>
  </section>
</div>
